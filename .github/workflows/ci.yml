name: CI

on:
  push:
    branches: [master]
  # There is deliberately no `pull_request:`. Work here lands on master, so a
  # PR run was a second copy of the very same commits - opening one and merging
  # it fired the whole suite twice for one change - and the concurrency group
  # below cannot collapse them, because a PR's ref is `refs/pull/N/merge` and
  # the merge push's is `refs/heads/master`. Add it back the day this repo
  # takes changes it did not write itself.
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by vite.config.mjs (do not open a browser) and playwright.config.ts
  # (never adopt a server this job did not start). Actions sets it already;
  # naming it here keeps the contract visible.
  CI: true

jobs:
  # Types, lint, formatting, unit tests and a real production build. This is the
  # job that has to stay green: everything else is measured against it.
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose - the action reads `packageManager` from
      # package.json, so pnpm stays pinned in exactly one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and format check
        run: pnpm check-all

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Playwright against the dev server. Split from `check` so a flaky browser
  # run never hides a type error, and so the two run in parallel.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Browsers are ~150MB and unchanged between runs; key on the resolved
      # Playwright version so a dependency bump invalidates the cache.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # A cache hit still needs the OS-level libraries, which are not cached.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # Deep links can only fail on a host with no history fallback, which the
      # dev server is not. This builds and serves build/ the way GitHub Pages
      # does. See tools/serve-build.mjs.
      - name: Routing tests against the production build
        run: pnpm test:routing

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes to https://amankori2307.github.io/monopoly/ on every push to
  # master, and only after both jobs above are green - a red build must not
  # reach the live site.
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Its own group, and NOT cancel-in-progress: the top-level group cancels on
    # a new push, and a deploy interrupted mid-push is how a half-written tree
    # ends up being served.
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      # To push the built tree to the gh-pages branch. Nothing else.
      contents: write
    environment:
      name: github-pages
      url: https://amankori2307.github.io/monopoly/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Production mode, which is the only mode that resolves the Supabase
      # config - see .env.production. It is also the only mode compiled for the
      # /monopoly/ base path the site is served from.
      - name: Build
        run: pnpm build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Pages serves this repo from the gh-pages branch at root, so the
          # built tree is the branch. `.nojekyll` stops Pages running Jekyll
          # over it, which would drop any file or folder starting with `_`.
          touch build/.nojekyll

          cd build
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"

          # Force-pushed as a single fresh commit. The branch is build output,
          # not history worth keeping, and this stops it growing without bound.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Say where it went
        run: |
          echo "Deployed https://amankori2307.github.io/monopoly/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "From \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"
